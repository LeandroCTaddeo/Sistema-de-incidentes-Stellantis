spring:
  application:
    name: sistema-incidentes-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sistema_incidentes}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

server:
  address: ${API_HOST:127.0.0.1}
  port: ${API_PORT:8080}
  shutdown: graceful

api:
  security:
    token: ${API_INTERNAL_TOKEN:}
    user: ${API_INTERNAL_USER:desktop-local}
    role: ${API_INTERNAL_ROLE:ADMIN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
