spring:
  application:
    name: sistema-incidentes-api
  servlet:
    multipart:
      max-file-size: ${INCIDENTES_MAX_IMAGE_SIZE:10MB}
      max-request-size: ${INCIDENTES_MAX_REQUEST_SIZE:50MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sistema_incidentes}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

server:
  address: ${API_HOST:127.0.0.1}
  port: ${API_PORT:8080}
  shutdown: graceful

api:
  security:
    identity-from-principal: false
    token: ${API_INTERNAL_TOKEN:}
    user: ${API_INTERNAL_USER:desktop-local}
    role: ${API_INTERNAL_ROLE:ADMIN}
  storage:
    root: ${INCIDENTES_FILES_PATH:${user.home}/SistemaIncidentes/imagenes}
    allow-legacy-absolute-paths: ${INCIDENTES_ALLOW_LEGACY_ABSOLUTE_PATHS:false}
    max-images-per-incident: ${INCIDENTES_MAX_IMAGES:10}
    max-image-bytes: ${INCIDENTES_MAX_IMAGE_BYTES:10485760}
    max-image-dimension: ${INCIDENTES_MAX_IMAGE_DIMENSION:12000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
